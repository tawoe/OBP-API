name: Build and publish container non develop

on:
  workflow_run:
    workflows: [build maven artifact]
    branches:
      - '*'
      - '!develop'
    types:
      - completed

env:
  DOCKER_HUB_ORGANIZATION: ${{ vars.DOCKER_HUB_ORGANIZATION }}
  DOCKER_HUB_REPOSITORY: obp-api

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.status == 'completed' }}
    steps:
      - name: Get triggering workflow details
        uses: actions/github-script@v7
        id: get_branch
        with:
          script: |
            const run_id = context.payload.workflow_run.id;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const response = await github.rest.actions.getWorkflowRun({
              owner,
              repo,
              run_id
            });

            const branch = response.data.head_branch;
            console.log(`Branch: ${branch}`);
            core.setOutput("branch", branch);

      - name: Checkout correct branch
        uses: actions/checkout@v3
        with:
          ref: ${{ steps.get_branch.outputs.branch }}

      - name: 'Download artifact'
        uses: actions/github-script@v7
        with:
          script: |
            var artifacts = await github.rest.actions.listWorkflowRunArtifacts({
               owner: context.repo.owner,
               repo: context.repo.repo,
               run_id: ${{github.event.workflow_run.id }},
            });
            var matchArtifact = artifacts.data.artifacts.filter((artifact) => {
              return artifact.name == "push"
            })[0];
            var download = await github.rest.actions.downloadArtifact({
               owner: context.repo.owner,
               repo: context.repo.repo,
               artifact_id: matchArtifact.id,
               archive_format: 'zip',
            });
            var fs = require('fs');
            fs.writeFileSync('${{github.workspace}}/push.zip', Buffer.from(download.data));
      - run: unzip push.zip

      - name: prepare the artifact
        run: |
          mkdir -p obp-api/target/
          cp obp-api-1.10.1.war obp-api/target/obp-api-1.10.1.war

      - name: Build the Docker image
        run: |
          cat .github/Dockerfile_PreBuild
          echo "${{ secrets.DOCKER_HUB_TOKEN }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin docker.io
          echo "working branch: ${{ steps.extract_branch.outputs.branch }}"
          docker build . --file .github/Dockerfile_PreBuild --tag docker.io/${{ env.DOCKER_HUB_ORGANIZATION }}/${{ env.DOCKER_HUB_REPOSITORY }}:$GITHUB_SHA  --tag docker.io/${{ env.DOCKER_HUB_ORGANIZATION }}/${{ env.DOCKER_HUB_REPOSITORY }}:${{ steps.get_branch.outputs.branch }}
          docker push docker.io/${{ env.DOCKER_HUB_ORGANIZATION }}/${{ env.DOCKER_HUB_REPOSITORY }} --all-tags
          echo docker done




